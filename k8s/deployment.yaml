apiVersion: apps/v1
kind: Deployment

metadata:
  name: arg-demo-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: arg-demo-app

  template:
    metadata:
      labels:
        app: arg-demo-app

    spec:
      containers:
      - name: app
        image: yourdockerhubuser/arg-demo-app:initial
        ports:
        - containerPort: 8080
